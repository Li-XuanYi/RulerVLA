[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulervla"
version = "0.5.0"
description = "Action-aligned spatial middleware between LIBERO and OpenPI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
smoke = ["h5py>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openpi = ["LICENSE"]
openpi_client = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
